<script>
(function(){
  const tl = gsap.timeline({ paused: true });
  const world = document.getElementById("furnace-world");
  const K = [[0.0, 960, 540, 1.0]];
  const ease = (x) => x < 0.5 ? 2*x*x : 1 - Math.pow(-2*x + 2, 2) / 2;   // power2.inOut
  function camAt(t) {
    // continuous take: between keys the camera travels; while holding it keeps a slow 1%/s push
    let k0 = K[0], k1 = K[0];
    for (let i = 0; i < K.length; i++) { if (t >= K[i][0]) { k0 = K[i]; k1 = K[i + 1] || K[i]; } }
    if (t < K[0][0]) { k0 = k1 = K[0]; }
    const travel = Math.min(1.0, Math.max(0.01, 0.5 * (k1[0] - k0[0])));
    const m = k1 === k0 ? 0 : ease(Math.min(1, Math.max(0, (t - (k1[0] - travel)) / travel)));
    const drift = 1 + 0.010 * Math.max(0, t - k0[0]) * (1 - m);
    const cx = k0[1] + (k1[1] - k0[1]) * m, cy = k0[2] + (k1[2] - k0[2]) * m;
    const s = k0[3] * Math.pow(k1[3] / k0[3], m) * Math.min(drift, 1.06);
    return [cx, cy, s];
  }
  const clock = { t: 0 };
  function render(t) {
    const [cx, cy, s] = camAt(t);
    world.style.transform = "translate(" + (960 - cx * s).toFixed(2) + "px," + (540 - cy * s).toFixed(2) + "px) scale(" + s.toFixed(5) + ")";
    if (window.__render_furnace) window.__render_furnace(t);
  }
  tl.to(clock, { t: 3.58, duration: 3.58, ease: "none", onUpdate: () => render(clock.t) }, 0);
  render(0);
  
    tl.fromTo("#furnace-flood",{opacity:1},{opacity:0,duration:0.45,ease:"power2.in"},0.25);
  tl.fromTo("#furnace-v1",{clipPath:"inset(50% 50% 50% 50%)"},{clipPath:"inset(0% 0% 0% 0%)",duration:0.4,ease:"expo.out"},0.0);
  tl.fromTo("#furnace-v2",{clipPath:"inset(50% 50% 50% 50%)"},{clipPath:"inset(0% 0% 0% 0%)",duration:0.35,ease:"expo.out"},1.53);
  tl.fromTo("#furnace-d3 .w",{opacity:0,filter:"blur(8px)"},{opacity:1,filter:"blur(0px)",duration:0.2,ease:"expo.out",stagger:0.08},0.05);
  tl.fromTo("#furnace-d4 .w",{opacity:0,filter:"blur(8px)"},{opacity:1,filter:"blur(0px)",duration:0.2,ease:"expo.out",stagger:0.08},0.81);
  tl.fromTo("#furnace-d5 .w",{opacity:0,filter:"blur(8px)"},{opacity:1,filter:"blur(0px)",duration:0.2,ease:"expo.out",stagger:0.08},1.63);
  tl.fromTo("#furnace-d6 .w",{opacity:0,filter:"blur(8px)"},{opacity:1,filter:"blur(0px)",duration:0.2,ease:"expo.out",stagger:0.08},2.71);
  window.__timelines = window.__timelines || {};
  window.__timelines["furnace"] = tl;
})();
